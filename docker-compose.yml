services:
  # 1. DATABASE
  db:
    image: postgres:16-alpine
    container_name: umer-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: umer_pansar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - umer-network

  # 2. BACKEND API (Docker Hub ka poora naam)
  backend:
    image: abdullahmasaud10/umer-backend:latest
    container_name: umer-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password123@db:5432/umer_pansar
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - umer-network

  # 3. FRONTEND (Docker Hub ka poora naam + Port 80)
  frontend:
    image: abdullahmasaud10/umer-frontend:latest
    container_name: umer-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - umer-network

volumes:
  postgres_data:

networks:
  umer-network:
    driver: bridge
