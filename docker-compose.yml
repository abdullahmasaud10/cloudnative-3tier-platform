services:
  # ========================================================
  # PERSISTENCE TIER: PostgreSQL 16 Stateful Service
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: umer-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: umer_pansar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cloudnative-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # APPLICATION TIER: Express REST API Service
  # ========================================================
  backend:
    image: abdullahmasaud10/umer-backend:latest
    container_name: umer-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password123@db:5432/umer_pansar
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudnative-net

  # ========================================================
  # PRESENTATION TIER: NGINX Reverse Proxy & Static Server
  # ========================================================
  frontend:
    image: abdullahmasaud10/umer-frontend:latest
    container_name: umer-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cloudnative-net

# ========================================================
# STORAGE & NETWORK ISOLATION DEFINITIONS
# ========================================================
volumes:
  postgres_data:
    driver: local

networks:
  cloudnative-net:
    driver: bridge
