name: Complete CI/CD Pipeline (Build, Push & Deploy)

on:
  push:
    branches: [ "main" ]

jobs:
  # PART 1: CI (Build & Push to Docker Hub)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            abdullahmasaud10/umer-backend:latest
            abdullahmasaud10/umer-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            abdullahmasaud10/umer-frontend:latest
            abdullahmasaud10/umer-frontend:${{ github.sha }}

  # PART 2: CD (Automated Deploy to AWS EC2)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloudnative-3tier-platform
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
